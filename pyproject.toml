[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accountix"
version = "0.1.0"
description = "Accountix — accounting and inventory management for SMEs (initial market: Iran)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "waitress>=3.0,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "openpyxl>=3.1,<3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend"]
testpaths = ["backend", "tests"]
addopts = "-q"
