{% extends "base.html" %}{% block content %}
<h1>دفتر روزنامه</h1>
<div class="card"><table><tr><th>تاریخ</th><th>شرح</th><th>شرکت</th><th>وضعیت</th><th>بدهکار</th><th>بستانکار</th></tr>
{% for e in entries %}<tr><td>{{ e.entry_date }}</td><td>{{ e.description }}</td><td>{{ e.company }}</td><td>{{ e.status }}</td><td>{{ e.total_debit }}</td><td>{{ e.total_credit }}</td></tr>
{% empty %}<tr><td colspan="6" class="empty">سندی ثبت نشده است</td></tr>{% endfor %}</table></div>{% endblock %}
